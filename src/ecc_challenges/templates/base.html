<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1420">
  <title>{% block title %}ECC Challenges{% endblock %}</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1420;--panel:#10212f;--line:#304655;--text:#f3f0e9;--muted:#adbec3;--accent:#9cddca;--gold:#e4bd7c}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;background:radial-gradient(ellipse 950px 550px at 80% -10%,#204639aa,transparent 68%),radial-gradient(ellipse 750px 600px at -15% 40%,#1c3347aa,transparent 70%),var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    a{color:var(--accent)}a:hover{text-decoration:none}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.wrap{width:min(1200px,calc(100% - 64px));margin:auto}
    .site-header{border-bottom:1px solid #28414bc0;background:#0b1420d9;backdrop-filter:blur(16px);position:relative;z-index:2}.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:28px;min-height:82px}
    .brand{display:inline-flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;font-size:1.05rem;font-weight:800;white-space:nowrap}.brand span:last-child span{color:var(--accent)}.brand-mark{display:inline-grid;place-items:center;width:37px;height:37px;border:1.5px solid var(--accent);border-radius:9px;transform:rotate(45deg);font:700 15px Georgia,serif;color:var(--accent)}.brand-mark b{transform:rotate(-45deg)}
    nav{display:flex;align-items:center;gap:28px}nav a{color:#cbd7d6;text-decoration:none;font-size:.91rem;font-weight:600}nav a:hover{color:var(--accent)}nav .nav-join{border:1px solid #688a82;padding:9px 14px;border-radius:7px;color:var(--accent)}
    main{padding:82px 0 112px}h1,h2,h3,p{margin-top:0}h1,h2,h3{line-height:1.12;letter-spacing:-.035em}h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(3.5rem,7.5vw,7rem);line-height:1.02;max-width:950px;margin-bottom:28px}h1 em{color:var(--accent);font-weight:400}h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(2rem,4vw,3.35rem);margin-bottom:20px}h3{font-size:1.18rem;margin-bottom:12px}p{margin-bottom:18px}.lead{font-size:clamp(1.06rem,1.7vw,1.25rem);color:#c8d4d3;max-width:690px;line-height:1.7}.muted{color:var(--muted)}
    .eyebrow{color:var(--gold);font-size:.75rem;letter-spacing:.19em;text-transform:uppercase;font-weight:800;margin-bottom:18px}.button{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:#0b2927;padding:13px 19px;font-weight:750;text-decoration:none;cursor:pointer;font:inherit;line-height:1.2}.button.secondary{background:transparent;color:var(--accent)}.button.danger{color:#f6c7c7;border-color:#a65f65;background:transparent}.button:hover{filter:brightness(1.08)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:32px 0 48px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:58px 0}.card{background:linear-gradient(145deg,#152c38,var(--panel));border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 12px 36px #06121c33}.card p:last-child{margin-bottom:0}.card .number{font:400 2.8rem Georgia,serif;color:var(--gold);margin-bottom:16px}
    .section{padding-top:60px;margin-top:70px;border-top:1px solid var(--line)}.section-heading{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:30px}.section-heading p{max-width:470px}.stack{display:grid;grid-template-columns:1fr 1fr;gap:38px}.code{background:#08121b;border:1px solid #355263;border-radius:8px;padding:20px;overflow:auto;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:#c8e6e4}
    label{display:block;color:var(--muted);font-size:.9rem;margin-bottom:8px}input[type=text],select{width:min(460px,100%);padding:12px;background:#091622;border:1px solid var(--line);border-radius:7px;color:var(--text);font:inherit}form.inline{display:inline}
    .table-shell{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#0c1925}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:15px 13px;border-bottom:1px solid #243b49;vertical-align:middle}th{color:#b4c6c8;font-size:.69rem;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#18334455}td:first-child{white-space:nowrap}td small{display:block;color:var(--muted);font-size:.75rem;margin-top:2px}.mono,code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.pill{display:inline-flex;align-items:center;border:1px solid #455d66;border-radius:30px;padding:4px 9px;font-size:.72rem;font-weight:700;white-space:nowrap}.pill-active{border-color:#5b967f;color:#a0e3bf;background:#20493455}.pill-solved{border-color:#a68a59;color:#e8c98d;background:#4b3b2355}.pill-neutral{color:#b7c6ca}
    .hero-line{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(230px,.8fr);align-items:center;gap:20px;min-height:360px}.orbit-art{position:relative;width:min(100%,350px);aspect-ratio:1;margin:auto;filter:drop-shadow(0 18px 46px #0b5d4c55)}.orbit{position:absolute;border:1px solid #5eaa9b80;border-radius:50%;inset:12%}.orbit-two{inset:24%;border-color:#e4ba7e77;transform:rotate(70deg) scaleX(.48)}.orbit-three{inset:3%;border-color:#8ad8bf50;transform:rotate(-28deg) scaleX(.55)}.orbit-core{position:absolute;inset:46%;border-radius:50%;background:var(--gold);box-shadow:0 0 24px #d7a86a,0 0 70px #6ed2b360}.orbit-art:before,.orbit-art:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);top:19%;left:26%;box-shadow:0 0 20px var(--accent)}.orbit-art:after{background:var(--gold);top:76%;left:77%;width:7px;height:7px}
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}.stat{background:#10222f;padding:24px 26px;display:flex;flex-direction:column;gap:7px}.stat-label{font-size:.73rem;color:var(--gold);text-transform:uppercase;letter-spacing:.15em;font-weight:750}.stat strong{font:400 clamp(2rem,4vw,3.5rem) Georgia,serif;color:var(--text);line-height:1.05}.stat span:last-child{color:var(--muted);font-size:.82rem}
    .metric-card{align-self:start}.metric-row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:13px 0}.metric-row span{color:var(--muted)}.metric-row strong{color:var(--text);font-variant-numeric:tabular-nums}.metric-card small{display:block;color:var(--muted);margin-top:19px}.notice{border-left:3px solid var(--gold);padding:10px 15px;background:#4b3b234d}.closing{display:flex;justify-content:space-between;align-items:center;gap:30px}.closing p{max-width:620px}.source-note{color:var(--muted);font-size:.83rem;margin-top:38px}.secret{color:var(--gold);user-select:all}
    .site-footer{border-top:1px solid var(--line);padding:36px 0;color:var(--muted);font-size:.85rem}.site-footer .wrap{display:flex;justify-content:space-between;gap:24px}.site-footer a{color:#c8d4d3}
    @media(max-width:850px){.stat-grid{grid-template-columns:repeat(2,1fr)}.hero-line{grid-template-columns:1fr}.orbit-art{display:none}.section-heading,.closing{align-items:start;flex-direction:column}.stack{grid-template-columns:1fr}.site-header .wrap{min-height:72px}nav{gap:16px}}
    @media(max-width:620px){.wrap{width:min(100% - 32px,1200px)}main{padding:54px 0 75px}.grid,.stat-grid{grid-template-columns:1fr}.grid{margin:36px 0}.section{padding-top:40px;margin-top:46px}nav{gap:10px}nav a{font-size:.78rem}nav a:first-child{display:none}.site-footer .wrap{flex-direction:column}th,td{padding:12px 10px}}
    @media(max-width:460px){.site-header .wrap{gap:12px}.brand{font-size:.95rem;gap:8px}.brand-mark{width:32px;height:32px}nav{gap:12px}nav a[href="/#campaigns"]{display:none}nav .nav-join{white-space:nowrap;padding:8px 10px}}
  </style>
</head>
<body>
  <header class="site-header"><div class="wrap"><a class="brand" href="/"><span class="brand-mark"><b>∑</b></span><span>ECC <span>Challenges</span></span></a><nav><a href="/#how">How it works</a><a href="/#campaigns">Challenges</a><a href="/status">Status</a>{% if request.session.get('github_id') %}<a class="nav-join" href="/dashboard">Dashboard ↗</a>{% else %}<a class="nav-join" href="/auth/github">Sign in ↗</a>{% endif %}</nav></div></header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><div class="wrap"><span>ECC Challenges · Open, reproducible computation.</span><span>Challenge results require independent verification. <a href="/status">Campaign status</a></span></div></footer>
</body>
</html>
