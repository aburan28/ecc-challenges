<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b2b">
  <title>{% block title %}ECC Challenges{% endblock %}</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1320;--panel:#152338;--line:#2a405a;--text:#ecf2f9;--muted:#a9bed2;--accent:#8de6bb;--gold:#f6c96e}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#1e3a51 0,transparent 40%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:var(--accent)}a:hover{text-decoration:none}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}
    header{border-bottom:1px solid var(--line);background:#0b1320bb;backdrop-filter:blur(10px)}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:72px}
    .brand{text-decoration:none;color:var(--text);font-size:1.15rem;font-weight:800;letter-spacing:.02em}.brand span{color:var(--accent)}nav{display:flex;gap:22px;align-items:center}nav a{color:var(--muted);text-decoration:none;font-size:.93rem}
    main{padding:60px 0 96px}h1,h2,h3{line-height:1.16;letter-spacing:-.035em}h1{font-size:clamp(2.5rem,6vw,5.1rem);margin:0 0 24px;max-width:860px}h2{font-size:2rem;margin:0 0 20px}h3{font-size:1.17rem;margin:0 0 10px}p{margin:0 0 18px}.muted{color:var(--muted)}.eyebrow{color:var(--accent);font-size:.78rem;letter-spacing:.17em;text-transform:uppercase;font-weight:800;margin-bottom:20px}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#092018;padding:12px 18px;font-weight:750;text-decoration:none;cursor:pointer;font:inherit}.button.secondary{background:transparent;color:var(--accent)}.button.danger{color:#ffd8d8;border-color:#9d5b5b;background:transparent}.button:hover{filter:brightness(1.1)}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin:32px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:58px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}.card p:last-child{margin-bottom:0}.card .number{font-size:2.2rem;font-weight:800;color:var(--gold);margin-bottom:8px}
    .section{padding-top:32px;margin-top:56px;border-top:1px solid var(--line)}.stack{display:grid;grid-template-columns:1fr 1fr;gap:32px}.code{background:#07101b;border:1px solid var(--line);border-radius:8px;padding:18px;overflow:auto;font:13px/1.55 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;word-break:break-word;color:#d2e7f8}
    label{display:block;color:var(--muted);font-size:.9rem;margin-bottom:8px}input[type=text]{width:min(460px,100%);padding:12px;background:#07101b;border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit}form.inline{display:inline}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}.secret{color:var(--gold);user-select:all}footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:.88rem}
    @media(max-width:760px){.grid,.stack{grid-template-columns:1fr}header .wrap{min-height:64px}nav{gap:12px}nav a{font-size:.82rem}main{padding-top:42px}table{font-size:.85rem}}
  </style>
</head>
<body>
  <header><div class="wrap"><a class="brand" href="/">ECC <span>Challenges</span></a><nav><a href="/#how">How it works</a><a href="/#research">Research</a>{% if request.session.get('github_id') %}<a href="/dashboard">Dashboard</a>{% else %}<a href="/auth/github">Sign in</a>{% endif %}</nav></div></header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer><div class="wrap">Open, reproducible elliptic-curve computation. Challenge results require independent verification.</div></footer>
</body>
</html>
