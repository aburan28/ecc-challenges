# Shared worker definition. Apply an overlay, not this directory:
#   kubectl apply -k deploy/kubernetes/cpu   (or gpu)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecc-challenges
labels:
  - pairs: {app.kubernetes.io/name: ecc-worker, app.kubernetes.io/part-of: ecc-challenges}
    includeSelectors: true
resources:
  - namespace.yaml
  - statefulset.yaml
secretGenerator:
  # Put your key in deploy/kubernetes/base/api-key first (one line, no
  # trailing newline needed). The file is git-ignored.
  - name: ecc-api-key
    files: [api-key]
    options: {disableNameSuffixHash: true}
