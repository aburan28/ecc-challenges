# A StatefulSet, not a Deployment: every worker needs its own persistent
# state directory that survives restarts and is never shared. Each replica
# gets its own volume (data-ecc-worker-0, -1, ...) and keeps its run.
# One API key allows at most 8 active runs, so keep replicas <= 8 per key.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ecc-worker
spec:
  serviceName: ecc-worker
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels: {}
  template:
    spec:
      # The worker uploads its outbox and saves state on SIGTERM.
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: worker-image
          env:
            - name: ECC_CAMPAIGN
              value: eccp-131
            - name: ECC_PROTOCOL
              value: "2"
            - name: ECC_API_URL
              value: https://ecc-challenges.com
            - name: ECC_API_KEY_FILE
              value: /run/secrets/ecc/api-key
            - name: ECC_STATE_DIR
              value: /data
            - name: HOME
              value: /tmp
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: api-key, mountPath: /run/secrets/ecc, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: api-key
          secret: {secretName: ecc-api-key, defaultMode: 0440}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
