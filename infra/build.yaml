AWSTemplateFormatVersion: '2010-09-09'
Description: Explicit release builds on Linux when the operator's Docker host is unavailable.
Parameters:
  Commit: {Type: String, AllowedPattern: '^[0-9a-f]{40}$'}
  Bucket: {Type: String}
  PublicWorkerRepository: {Type: String, AllowedPattern: '^public\.ecr\.aws/[A-Za-z0-9_-]+/ecc-challenges-worker$'}
Resources:
  Logs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /ecc-challenges/release-build, RetentionInDays: 30}
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnLike: {aws:SourceArn: !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/ecc-challenges-release'}
      Policies:
        - PolicyName: release-artifacts-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${Logs.Arn}:*'
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken, ecr-public:GetAuthorizationToken]
                Resource: '*'
              - Effect: Allow
                Action: sts:GetServiceBearerToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer,
                         ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload,
                         ecr:PutImage, ecr:DescribeImages]
                Resource:
                  - !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/ecc-challenges-web'
                  - !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/ecc-challenges-audit'
                  - !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/ecc-challenges-admin'
              - Effect: Allow
                Action: [ecr-public:BatchCheckLayerAvailability, ecr-public:InitiateLayerUpload,
                         ecr-public:UploadLayerPart, ecr-public:CompleteLayerUpload,
                         ecr-public:PutImage, ecr-public:DescribeImages]
                Resource: !Sub 'arn:aws:ecr-public::${AWS::AccountId}:repository/ecc-challenges-worker'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${Bucket}/release-builds/*'
  ReleaseBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: ecc-challenges-release
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 60
      QueuedTimeoutInMinutes: 10
      ConcurrentBuildLimit: 1
      Artifacts: {Type: NO_ARTIFACTS}
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - git init .
                - git remote add origin https://github.com/aburan28/ecc-challenges.git
                - git fetch --depth 1 origin "$RELEASE_COMMIT"
                - git checkout --detach FETCH_HEAD
                - bash scripts/build_release.sh
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - {Name: RELEASE_COMMIT, Value: !Ref Commit}
          - {Name: RELEASE_ACCOUNT, Value: !Ref 'AWS::AccountId'}
          - {Name: RELEASE_BUCKET, Value: !Ref Bucket}
          - {Name: PUBLIC_WORKER_REPOSITORY, Value: !Ref PublicWorkerRepository}
      LogsConfig:
        CloudWatchLogs: {Status: ENABLED, GroupName: !Ref Logs}
Outputs:
  ProjectName: {Value: !Ref ReleaseBuild}
