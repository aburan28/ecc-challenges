AWSTemplateFormatVersion: '2010-09-09'
Description: ECC Challenges HTTPS, autoscaled stateless API, independent audit and indexing pools.

Parameters:
  VpcId: {Type: AWS::EC2::VPC::Id}
  SubnetA: {Type: AWS::EC2::Subnet::Id}
  SubnetB: {Type: AWS::EC2::Subnet::Id}
  CertificateArn: {Type: String}
  WebImageUri: {Type: String, AllowedPattern: '^.+@sha256:[0-9a-f]{64}$'}
  AuditImageUri: {Type: String, AllowedPattern: '^.+@sha256:[0-9a-f]{64}$'}
  PublicWorkerImage: {Type: String, AllowedPattern: '^(public\.ecr\.aws/[A-Za-z0-9_-]+|ghcr\.io/aburan28)/ecc-challenges-worker@sha256:[0-9a-f]{64}$'}
  GithubSecretArn: {Type: String}
  WebPasswordArn: {Type: String}
  WorkerPasswordArn: {Type: String}
  KeyPepperArn: {Type: String}
  SessionSecretArn: {Type: String}
  AuditQueueArn: {Type: String}
  AuditQueueUrl: {Type: String}
  IndexQueueArn: {Type: String}
  IndexQueueUrl: {Type: String}
  CollisionQueueArn: {Type: String}
  CollisionQueueUrl: {Type: String}
  DomainName: {Type: String, Default: ecc-challenges.com}
  Bucket: {Type: String}
  DbHost: {Type: String}
  DbName: {Type: String, Default: rho_dp}
  StreamId: {Type: String, Default: ecc-challenges-v1}
  WebTasks: {Type: Number, Default: 0, MinValue: 0, MaxValue: 8}
  AuditTasks: {Type: Number, Default: 0, MinValue: 0, MaxValue: 32}
  IndexTasks: {Type: Number, Default: 0, MinValue: 0, MaxValue: 8}
  ReconcileTasks: {Type: Number, Default: 0, MinValue: 0, MaxValue: 1}
  ResolveTasks: {Type: Number, Default: 0, MinValue: 0, MaxValue: 8}
  AlertEmail: {Type: String, Default: ''}
  MulticurveEnabled: {Type: String, Default: 'false', AllowedValues: ['true', 'false']}
  MulticurveCanaryKey: {Type: String, Default: '', AllowedPattern: '^$|^[0-9a-f]{24}$'}
  MaxPendingBatches: {Type: Number, Default: 512, MinValue: 16, MaxValue: 100000}

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  PointIndex:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ecc-challenges-points-v2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
  PointIndexThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ecc-challenges-v2-point-index-throttled
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions: [{Name: TableName, Value: !Ref PointIndex}]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  Cluster:
    Type: AWS::ECS::Cluster
    Properties: {ClusterName: ecc-challenges}
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECC Challenges public HTTPS ingress
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECC Challenges web tasks; only ALB may connect
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECC Challenges private audit and index tasks; no inbound rules
      VpcId: !Ref VpcId
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: ecc-challenges
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - {Key: deletion_protection.enabled, Value: 'true'}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
        - {Key: idle_timeout.timeout_seconds, Value: '300'}
  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: ecc-challenges-web
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '60'}
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref WebTargetGroup}]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: ecc-challenges
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: eccChallengesWaf, SampledRequestsEnabled: true}
      Rules:
        - Name: global-ip-rate
          Priority: 0
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                ResponseHeaders: [{Name: Retry-After, Value: '60'}]
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: globalIpRate, SampledRequestsEnabled: true}
          Statement:
            RateBasedStatement: {AggregateKeyType: IP, Limit: 10000, EvaluationWindowSec: 300}
        - Name: enrollment-ip-rate
          Priority: 1
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                ResponseHeaders: [{Name: Retry-After, Value: '60'}]
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: enrollmentIpRate, SampledRequestsEnabled: true}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 300
              EvaluationWindowSec: 300
              ScopeDownStatement:
                OrStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch: {UriPath: {}}
                        PositionalConstraint: STARTS_WITH
                        SearchString: /auth/
                        TextTransformations: [{Priority: 0, Type: NONE}]
                    - ByteMatchStatement:
                        FieldToMatch: {UriPath: {}}
                        PositionalConstraint: STARTS_WITH
                        SearchString: /keys
                        TextTransformations: [{Priority: 0, Type: NONE}]
  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties: {ResourceArn: !Ref LoadBalancer, WebACLArn: !GetAtt WebAcl.Arn}
  WebLogs: {Type: AWS::Logs::LogGroup, Properties: {LogGroupName: /ecc-challenges/web, RetentionInDays: 30}}
  AuditLogs: {Type: AWS::Logs::LogGroup, Properties: {LogGroupName: /ecc-challenges/audit, RetentionInDays: 30}}
  IndexLogs: {Type: AWS::Logs::LogGroup, Properties: {LogGroupName: /ecc-challenges/index, RetentionInDays: 30}}
  ReconcileLogs: {Type: AWS::Logs::LogGroup, Properties: {LogGroupName: /ecc-challenges/reconcile, RetentionInDays: 30}}
  ResolveLogs: {Type: AWS::Logs::LogGroup, Properties: {LogGroupName: /ecc-challenges/resolve, RetentionInDays: 30}}
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: read-injected-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref GithubSecretArn, !Ref WebPasswordArn, !Ref WorkerPasswordArn, !Ref KeyPepperArn, !Ref SessionSecretArn]
  WebTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: public-admission
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${Bucket}/seed-registry/curve-131/config.json
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${Bucket}/seed-registry/curve-131/run-*.json
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub arn:aws:s3:::${Bucket}/public-gateway/${StreamId}/runs/*
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub arn:aws:s3:::${Bucket}/public-gateway/${StreamId}/v2/*
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !Ref AuditQueueArn
  WorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: public-verification
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${Bucket}/public-gateway/${StreamId}/runs/*
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${Bucket}/public-gateway/${StreamId}/collision-leads/*
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub arn:aws:s3:::${Bucket}/public-gateway/${StreamId}/v2/*
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:DescribeTable]
                Resource: !GetAtt PointIndex.Arn
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility, sqs:SendMessage]
                Resource: [!Ref AuditQueueArn, !Ref IndexQueueArn, !Ref CollisionQueueArn]
  WebTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ecc-challenges-web
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '4096'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt WebTaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref WebImageUri
          Essential: true
          PortMappings: [{ContainerPort: 8080, Protocol: tcp}]
          Environment:
            - {Name: AWS_REGION, Value: !Ref AWS::Region}
            - {Name: PUBLIC_ORIGIN, Value: !Sub 'https://${DomainName}'}
            - {Name: ECC_BUCKET, Value: !Ref Bucket}
            - {Name: POINT_INDEX_TABLE, Value: !Ref PointIndex}
            - {Name: MULTICURVE_ENABLED, Value: !Ref MulticurveEnabled}
            - {Name: MAX_PENDING_BATCHES, Value: !Sub '${MaxPendingBatches}'}
            - {Name: MULTICURVE_CANARY_KEYS, Value: !Ref MulticurveCanaryKey}
            - {Name: DB_HOST, Value: !Ref DbHost}
            - {Name: DB_NAME, Value: !Ref DbName}
            - {Name: DB_USER, Value: ecc_site_web}
            - {Name: PUBLIC_STREAM_ID, Value: !Ref StreamId}
            - {Name: PUBLIC_WORKER_IMAGE, Value: !Ref PublicWorkerImage}
            - {Name: AUDIT_QUEUE_URL, Value: !Ref AuditQueueUrl}
            - {Name: INDEX_QUEUE_URL, Value: !Ref IndexQueueUrl}
            - {Name: COLLISION_QUEUE_URL, Value: !Ref CollisionQueueUrl}
          Secrets:
            - {Name: DB_PASSWORD, ValueFrom: !Ref WebPasswordArn}
            - {Name: KEY_PEPPER, ValueFrom: !Ref KeyPepperArn}
            - {Name: SESSION_SECRET, ValueFrom: !Ref SessionSecretArn}
            - {Name: GITHUB_CLIENT_ID, ValueFrom: !Sub '${GithubSecretArn}:client_id::'}
            - {Name: GITHUB_CLIENT_SECRET, ValueFrom: !Sub '${GithubSecretArn}:client_secret::'}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref WebLogs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: web}
  WorkerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ecc-challenges-worker
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '2048'
      Memory: '4096'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Ref AuditImageUri
          Essential: true
          Environment:
            - {Name: AWS_REGION, Value: !Ref AWS::Region}
            - {Name: ECC_BUCKET, Value: !Ref Bucket}
            - {Name: POINT_INDEX_TABLE, Value: !Ref PointIndex}
            - {Name: MULTICURVE_ENABLED, Value: !Ref MulticurveEnabled}
            - {Name: MAX_PENDING_BATCHES, Value: !Sub '${MaxPendingBatches}'}
            - {Name: MULTICURVE_CANARY_KEYS, Value: !Ref MulticurveCanaryKey}
            - {Name: DB_HOST, Value: !Ref DbHost}
            - {Name: DB_NAME, Value: !Ref DbName}
            - {Name: DB_USER, Value: ecc_site_worker}
            - {Name: PUBLIC_STREAM_ID, Value: !Ref StreamId}
            - {Name: AUDIT_QUEUE_URL, Value: !Ref AuditQueueUrl}
            - {Name: INDEX_QUEUE_URL, Value: !Ref IndexQueueUrl}
            - {Name: COLLISION_QUEUE_URL, Value: !Ref CollisionQueueUrl}
          Secrets: [{Name: DB_PASSWORD, ValueFrom: !Ref WorkerPasswordArn}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref AuditLogs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: audit}
  IndexTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ecc-challenges-index
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      ContainerDefinitions:
        - Name: index
          Image: !Ref AuditImageUri
          Command: [python, -m, ecc_challenges.queues, index]
          Essential: true
          Environment:
            - {Name: AWS_REGION, Value: !Ref AWS::Region}
            - {Name: ECC_BUCKET, Value: !Ref Bucket}
            - {Name: POINT_INDEX_TABLE, Value: !Ref PointIndex}
            - {Name: MULTICURVE_ENABLED, Value: !Ref MulticurveEnabled}
            - {Name: MAX_PENDING_BATCHES, Value: !Sub '${MaxPendingBatches}'}
            - {Name: MULTICURVE_CANARY_KEYS, Value: !Ref MulticurveCanaryKey}
            - {Name: DB_HOST, Value: !Ref DbHost}
            - {Name: DB_NAME, Value: !Ref DbName}
            - {Name: DB_USER, Value: ecc_site_worker}
            - {Name: PUBLIC_STREAM_ID, Value: !Ref StreamId}
            - {Name: AUDIT_QUEUE_URL, Value: !Ref AuditQueueUrl}
            - {Name: INDEX_QUEUE_URL, Value: !Ref IndexQueueUrl}
            - {Name: COLLISION_QUEUE_URL, Value: !Ref CollisionQueueUrl}
          Secrets: [{Name: DB_PASSWORD, ValueFrom: !Ref WorkerPasswordArn}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref IndexLogs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: index}
  ReconcileTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ecc-challenges-reconcile
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      ContainerDefinitions:
        - Name: reconcile
          Image: !Ref AuditImageUri
          Command: [python, -m, ecc_challenges.queues, reconcile]
          Essential: true
          Environment:
            - {Name: AWS_REGION, Value: !Ref AWS::Region}
            - {Name: ECC_BUCKET, Value: !Ref Bucket}
            - {Name: POINT_INDEX_TABLE, Value: !Ref PointIndex}
            - {Name: MULTICURVE_ENABLED, Value: !Ref MulticurveEnabled}
            - {Name: MAX_PENDING_BATCHES, Value: !Sub '${MaxPendingBatches}'}
            - {Name: MULTICURVE_CANARY_KEYS, Value: !Ref MulticurveCanaryKey}
            - {Name: DB_HOST, Value: !Ref DbHost}
            - {Name: DB_NAME, Value: !Ref DbName}
            - {Name: DB_USER, Value: ecc_site_worker}
            - {Name: PUBLIC_STREAM_ID, Value: !Ref StreamId}
            - {Name: AUDIT_QUEUE_URL, Value: !Ref AuditQueueUrl}
            - {Name: INDEX_QUEUE_URL, Value: !Ref IndexQueueUrl}
            - {Name: COLLISION_QUEUE_URL, Value: !Ref CollisionQueueUrl}
          Secrets: [{Name: DB_PASSWORD, ValueFrom: !Ref WorkerPasswordArn}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref ReconcileLogs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: reconcile}
  ResolveTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ecc-challenges-resolve
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '2048'
      Memory: '4096'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      ContainerDefinitions:
        - Name: resolve
          Image: !Ref AuditImageUri
          Command: [python, -m, ecc_challenges.queues, resolve]
          Essential: true
          Environment:
            - {Name: AWS_REGION, Value: !Ref AWS::Region}
            - {Name: ECC_BUCKET, Value: !Ref Bucket}
            - {Name: POINT_INDEX_TABLE, Value: !Ref PointIndex}
            - {Name: MULTICURVE_ENABLED, Value: !Ref MulticurveEnabled}
            - {Name: MAX_PENDING_BATCHES, Value: !Sub '${MaxPendingBatches}'}
            - {Name: MULTICURVE_CANARY_KEYS, Value: !Ref MulticurveCanaryKey}
            - {Name: DB_HOST, Value: !Ref DbHost}
            - {Name: DB_NAME, Value: !Ref DbName}
            - {Name: DB_USER, Value: ecc_site_worker}
            - {Name: PUBLIC_STREAM_ID, Value: !Ref StreamId}
            - {Name: AUDIT_QUEUE_URL, Value: !Ref AuditQueueUrl}
            - {Name: INDEX_QUEUE_URL, Value: !Ref IndexQueueUrl}
            - {Name: COLLISION_QUEUE_URL, Value: !Ref CollisionQueueUrl}
          Secrets: [{Name: DB_PASSWORD, ValueFrom: !Ref WorkerPasswordArn}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref ResolveLogs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: resolve}
  WebService:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: ecc-challenges-web
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref WebTask
      DesiredCount: !Ref WebTasks
      DeploymentConfiguration: {MaximumPercent: 200, MinimumHealthyPercent: 100}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref WebSecurityGroup]
      LoadBalancers: [{ContainerName: web, ContainerPort: 8080, TargetGroupArn: !Ref WebTargetGroup}]
  AuditService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: ecc-challenges-audit
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref WorkerTask
      DesiredCount: !Ref AuditTasks
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref WorkerSecurityGroup]
  IndexService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: ecc-challenges-index
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref IndexTask
      DesiredCount: !Ref IndexTasks
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref WorkerSecurityGroup]
  ReconcileService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: ecc-challenges-reconcile
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref ReconcileTask
      DesiredCount: !Ref ReconcileTasks
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref WorkerSecurityGroup]
  ResolveService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: ecc-challenges-resolve
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref ResolveTask
      DesiredCount: !Ref ResolveTasks
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref WorkerSecurityGroup]
  WebScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: WebService
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/ecc-challenges-web'
      MinCapacity: !Ref WebTasks
      MaxCapacity: 8
  WebRequestScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: web-request-count
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref WebScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 1200
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join ['/', [!GetAtt LoadBalancer.LoadBalancerFullName, !GetAtt WebTargetGroup.TargetGroupFullName]]
        ScaleOutCooldown: 60
        ScaleInCooldown: 300
  AuditScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: AuditService
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/ecc-challenges-audit'
      MinCapacity: !Ref AuditTasks
      MaxCapacity: 32
  AuditQueueScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: audit-backlog
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AuditScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 10
        DisableScaleIn: true
        CustomizedMetricSpecification:
          Namespace: AWS/SQS
          MetricName: ApproximateNumberOfMessagesVisible
          Dimensions: [{Name: QueueName, Value: ecc-challenges-audit}]
          Statistic: Average
        ScaleOutCooldown: 60
        ScaleInCooldown: 600
  AuditCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: audit-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AuditScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 35
        DisableScaleIn: true
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleOutCooldown: 60
  IndexScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: IndexService
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/ecc-challenges-index'
      MinCapacity: !Ref IndexTasks
      MaxCapacity: 8
  IndexQueueScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: index-backlog
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref IndexScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 100
        CustomizedMetricSpecification:
          Namespace: AWS/SQS
          MetricName: ApproximateNumberOfMessagesVisible
          Dimensions: [{Name: QueueName, Value: ecc-challenges-index}]
          Statistic: Average
        ScaleOutCooldown: 60
        ScaleInCooldown: 300
  ResolveScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: ResolveService
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/ecc-challenges-resolve'
      MinCapacity: !Ref ResolveTasks
      MaxCapacity: 8
  ResolveQueueScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: resolve-backlog
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ResolveScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 1
        CustomizedMetricSpecification:
          Namespace: AWS/SQS
          MetricName: ApproximateNumberOfMessagesVisible
          Dimensions: [{Name: QueueName, Value: ecc-challenges-collision}]
          Statistic: Average
        ScaleOutCooldown: 60
        ScaleInCooldown: 900
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties: {TopicName: ecc-challenges-alerts}
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ecc-challenges-*'
  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail
  AuditAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ecc-challenges-audit-oldest-over-hour
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: ecc-challenges-audit}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3600
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
  IndexAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ecc-challenges-index-oldest-over-15-minutes
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: ecc-challenges-index}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
  AuditDeadAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ecc-challenges-audit-dead-letter
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: ecc-challenges-audit-dead}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
  IndexDeadAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ecc-challenges-index-dead-letter
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: ecc-challenges-index-dead}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
  ResolveDeadAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ecc-challenges-collision-dead-letter
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: ecc-challenges-collision-dead}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
  Accelerator:
    Type: AWS::GlobalAccelerator::Accelerator
    Properties:
      Name: ecc-challenges
      Enabled: true
      IpAddressType: IPV4
  AcceleratorListener:
    Type: AWS::GlobalAccelerator::Listener
    Properties:
      AcceleratorArn: !Ref Accelerator
      Protocol: TCP
      PortRanges: [{FromPort: 80, ToPort: 80}, {FromPort: 443, ToPort: 443}]
  AcceleratorEndpoint:
    Type: AWS::GlobalAccelerator::EndpointGroup
    Properties:
      ListenerArn: !Ref AcceleratorListener
      EndpointGroupRegion: !Ref AWS::Region
      HealthCheckProtocol: HTTPS
      HealthCheckPath: /health
      HealthCheckPort: 443
      EndpointConfigurations: [{EndpointId: !Ref LoadBalancer, Weight: 100}]

Outputs:
  LoadBalancerDns: {Value: !GetAtt LoadBalancer.DNSName}
  AcceleratorDns: {Value: !GetAtt Accelerator.DnsName}
  AcceleratorIpv4Addresses: {Value: !Join [',', !GetAtt Accelerator.Ipv4Addresses]}
  WebTargetGroupArn: {Value: !Ref WebTargetGroup}
  ClusterName: {Value: !Ref Cluster}
  WebServiceName: {Value: ecc-challenges-web}
  AuditServiceName: {Value: ecc-challenges-audit}
  IndexServiceName: {Value: ecc-challenges-index}
  ResolveServiceName: {Value: ecc-challenges-resolve}
  AlertTopicArn: {Value: !Ref AlertTopic}
