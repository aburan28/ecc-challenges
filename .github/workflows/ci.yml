name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q

  templates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cfn-lint>=1,<2'
      - run: cfn-lint infra/foundation.yaml infra/data.yaml infra/service.yaml infra/build.yaml infra/registry.yaml

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.web -t ecc-challenges-web:ci .
      - run: docker build -f Dockerfile.admin -t ecc-challenges-admin:ci .
      - run: docker build -f Dockerfile.audit -t ecc-challenges-audit:ci .
      - run: docker build -f worker/Dockerfile -t ecc-challenges-worker:ci .
