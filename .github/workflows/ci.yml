name: CI

# Superseded pull-request pushes are cancelled; every merge to main runs to the
# end so main's history shows a result for each commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q

  templates:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cfn-lint>=1,<2'
      - run: cfn-lint infra/foundation.yaml infra/data.yaml infra/service.yaml infra/build.yaml infra/registry.yaml infra/contributor-canary.yaml

  images:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.web -t ecc-challenges-web:ci .
      - run: docker build -f Dockerfile.admin -t ecc-challenges-admin:ci .
      - run: docker build -f Dockerfile.audit -t ecc-challenges-audit:ci .
      - run: docker build -f worker/Dockerfile -t ecc-challenges-worker:ci .
      - run: docker build -f worker/Dockerfile.cpu -t ecc-challenges-worker-cpu:ci .
      - run: docker run --rm --entrypoint /opt/ecc/generic-engine ecc-challenges-worker:ci --self-test
      - run: docker run --rm --entrypoint /opt/ecc/generic-engine-cpu ecc-challenges-worker:ci --self-test
      - name: Check all 24 curves in both final worker images
        run: |
          for image in ecc-challenges-worker:ci ecc-challenges-worker-cpu:ci; do
            docker run --rm --network none -e ECC_BACKEND=cpu "$image" --check
          done
      - run: docker run --rm --entrypoint /opt/ecc/generic-engine ecc-challenges-worker-cpu:ci --self-test

  cpu-arm64-image:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f worker/Dockerfile.cpu -t ecc-challenges-worker-cpu:ci .
      - name: Check all 24 curves in the final ARM64 image
        run: docker run --rm --network none -e ECC_BACKEND=cpu ecc-challenges-worker-cpu:ci --check

  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  /tmp/kubeconform.tgz" | sha256sum -c
          sudo tar -xzf /tmp/kubeconform.tgz -C /usr/local/bin kubeconform
      - run: scripts/check_deploy.sh
