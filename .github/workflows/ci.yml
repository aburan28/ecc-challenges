name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q

  templates:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cfn-lint>=1,<2'
      - run: cfn-lint infra/foundation.yaml infra/data.yaml infra/service.yaml infra/build.yaml infra/registry.yaml infra/contributor-canary.yaml

  images:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.web -t ecc-challenges-web:ci .
      - run: docker build -f Dockerfile.admin -t ecc-challenges-admin:ci .
      - run: docker build -f Dockerfile.audit -t ecc-challenges-audit:ci .
      - run: docker build -f worker/Dockerfile -t ecc-challenges-worker:ci .
      - run: docker build -f worker/Dockerfile.cpu -t ecc-challenges-worker-cpu:ci .
      - run: docker run --rm --entrypoint /opt/ecc/generic-engine ecc-challenges-worker:ci --self-test
      - run: docker run --rm --entrypoint /opt/ecc/generic-engine-cpu ecc-challenges-worker:ci --self-test
      - name: Run every campaign through the combined image CPU entry point
        run: |
          docker run --rm --entrypoint python3 ecc-challenges-worker:ci -c '
          from generic.client import engine_for_backend
          from generic.runtime import NativeState, run_round
          from ecc_challenges.multicurve.codec import Namespace
          from ecc_challenges.multicurve.instances import instance_ids
          campaigns = instance_ids()
          engine = engine_for_backend("cpu")
          assert len(campaigns) == 24 and engine.name == "generic-engine-cpu"
          for campaign in campaigns:
              ns = Namespace(campaign, dp_bits=1)
              state = NativeState(ns.start("18c3053b-96df-4879-a49d-18a52b8fdf8b", 0))
              result = run_round(engine, "cpu", ns, [state], 1)
              assert result.states[0].steps == 1
          print("24 campaign CPU rounds passed in the combined image")
          '
      - run: docker run --rm --entrypoint /opt/ecc/generic-engine ecc-challenges-worker-cpu:ci --self-test

  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  /tmp/kubeconform.tgz" | sha256sum -c
          sudo tar -xzf /tmp/kubeconform.tgz -C /usr/local/bin kubeconform
      - run: scripts/check_deploy.sh
