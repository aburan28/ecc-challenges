[package]
name = "eccstark"
version = "0.1.0"
edition = "2021"
description = "STARK proofs of Pollard-rho walks on elliptic curves over the Goldilocks field"
license = "MIT"

[dependencies]
winterfell = { version = "=0.13.1", features = ["concurrent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
