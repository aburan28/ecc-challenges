[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecc-challenges"
version = "0.1.0"
description = "Public ECC challenge site and distributed contributor gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "jinja2>=3.1,<4",
  "authlib>=1.4,<2",
  "httpx>=0.27,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "boto3>=1.35,<2",
  "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "moto[s3,sqs]>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecc_challenges = ["templates/*.html", "multicurve/*.json", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests", "worker/tests"]
